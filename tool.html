<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tool details | AutomationFindr</title>
<meta name="description" content="Pricing, features, honest reviews and alternatives for one automation tool.">
<meta name="theme-color" content="#FAFAF8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add('js')</script>
<link rel="stylesheet" href="shared.css">
<style>
/* ==========================================================================
   TOOL DETAIL PAGE
   ========================================================================== */
.thead{display:flex;gap:clamp(18px,3vw,32px);align-items:flex-start;padding-bottom:clamp(24px,4vw,40px)}
.thead .lg{width:84px;height:84px;border-radius:22px;font-size:1.5rem}
.thead .lg[data-n="3"]{font-size:1.25rem}
.thead h1{font-size:clamp(2.6rem,6vw,4.75rem);line-height:.98;letter-spacing:-.03em}
.tmeta{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-top:14px;font-size:.9375rem}
.tmeta a.pillcat{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 8px;border-radius:99px;border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));background:color-mix(in srgb,var(--c) 8%,#fff);font-weight:500;font-size:.875rem}
.tmeta a.pillcat svg{width:16px;height:16px;color:var(--c)}
.tmeta .dot{width:3px;height:3px;border-radius:50%;background:var(--line-strong)}
.tmeta .mute{color:var(--mute)}
.tline{margin-top:20px;font:italic 400 clamp(1.4rem,2.6vw,2rem)/1.2 var(--serif);max-width:28em;color:#2c2c2c}
.tact{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}

.tgrid{display:grid;grid-template-columns:288px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start;border-top:1px solid var(--line);padding-top:clamp(24px,4vw,40px)}
.side{position:sticky;top:96px;display:flex;flex-direction:column;gap:28px}
.side h2{font:600 .9375rem var(--sans);letter-spacing:-.01em;margin-bottom:12px}
.qi{display:grid;gap:0;margin:0}
.qi div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9375rem}
.qi dt{color:var(--mute)}.qi dd{margin:0;font-weight:500;text-align:right}
.qi dd.yes{color:#0B5A53}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pills a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line-strong);background:#fff;font-size:.8125rem;font-weight:500;transition:border-color var(--duration-fast),transform var(--duration-normal) var(--ease-out-expo)}
.pills a:hover{border-color:var(--teal);transform:translateY(-1px)}
.ints{display:flex;flex-wrap:wrap;gap:8px}
.ints span{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 5px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:.8125rem;font-weight:500}
.ints .lg{width:26px;height:26px;border-radius:7px;font-size:.625rem}

.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:clamp(24px,3vw,36px);position:sticky;top:64px;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);margin-inline:-4px;padding-inline:4px}
.tabs::-webkit-scrollbar{display:none}
.tabs [role=tab]{position:relative;flex:none;height:48px;padding:0 16px;font-weight:500;font-size:.9375rem;color:var(--mute);border-radius:10px 10px 0 0;transition:color var(--duration-fast)}
.tabs [role=tab]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--teal);transform:scaleX(0);transition:transform var(--duration-normal) var(--ease-out-expo)}
.tabs [role=tab]:hover{color:var(--ink)}
.tabs [role=tab][aria-selected=true]{color:var(--ink)}
.tabs [role=tab][aria-selected=true]::after{transform:none}
.tabs .ct{margin-left:6px;font:400 .75rem var(--mono);color:var(--mute)}
[role=tabpanel]{outline:0}
[role=tabpanel][hidden]{display:none}
[role=tabpanel]:not([hidden]){animation:panelIn .4s var(--ease-out-expo)}
@keyframes panelIn{from{opacity:0;transform:translateY(10px)}}
.panel h2{font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.1;margin-bottom:16px}
.panel h3{font:600 1.0625rem var(--sans);letter-spacing:-.01em;margin:0 0 10px}
.prose{max-width:var(--max-width-narrow)}
.prose p{font-size:1.0625rem;line-height:1.7;color:#333}
.prose p+p{margin-top:16px}

.fit{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:32px}
.fit>div{padding:22px;border-radius:20px;border:1px solid var(--line);background:#fff;box-shadow:var(--inset-hi),var(--shadow-1)}
.fit .yes{background:#F1F8F6;border-color:#CFE6E1}
.fit .no{background:#FBF5EE;border-color:#EEDCC3}
.fit h3{display:flex;align-items:center;gap:8px}
.fit svg{width:18px;height:18px;flex:none}
.fit .yes svg{color:var(--teal)}.fit .no svg{color:var(--amber-ink)}
.fit p{font:400 1.25rem/1.3 var(--serif)}

.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:0 0 36px}
.gal figure{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow-1)}
.gal .win{aspect-ratio:4/3;background:var(--sand);padding:12px 12px 0}
.gal .win>div{height:100%;border-radius:10px 10px 0 0;background:#fff;border:1px solid var(--line-strong);border-bottom:0;overflow:hidden}
.gal .bar{height:20px;border-bottom:1px solid var(--line);background:#fbfaf8;display:flex;align-items:center;gap:4px;padding:0 8px}
.gal .bar i{width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.gal figcaption{padding:10px 14px;font-size:.8125rem;color:var(--mute);border-top:1px solid var(--line)}
.gal svg{width:100%;height:calc(100% - 20px)}

.uniq{display:flex;gap:14px;align-items:flex-start;padding:20px;border-radius:18px;background:#FBF1DE;border:1px solid #F1DDB4;margin-bottom:32px}
.uniq svg{width:22px;height:22px;flex:none;color:var(--amber-ink);margin-top:2px}
.uniq b{display:block;font-weight:600;color:var(--amber-ink);margin-bottom:2px}
.fgroup{margin-bottom:30px}
.flist{display:grid;grid-template-columns:repeat(2,1fr);gap:0 28px}
.flist li{position:relative;display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.9375rem;outline-offset:-2px}
.flist svg{width:18px;height:18px;flex:none}
.flist .y svg{color:var(--teal)}.flist .n{color:var(--mute)}.flist .n svg{color:#a3a09a}
.flist li[data-tip]::after{content:attr(data-tip);position:absolute;left:30px;bottom:calc(100% - 4px);width:max-content;max-width:min(260px,70vw);padding:8px 11px;border-radius:9px;background:var(--ink);color:#fff;font-size:.8125rem;line-height:1.35;opacity:0;transform:translateY(4px);pointer-events:none;z-index:5;transition:opacity var(--duration-fast),transform var(--duration-normal) var(--ease-out-expo)}
.flist li:hover::after,.flist li:focus-visible::after{opacity:1;transform:none}

.free-ind{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:99px;font-size:.875rem;font-weight:600;margin-bottom:22px;background:#E6F4F1;color:#0B5A53;border:1px solid #C5E4DE}
.free-ind.paid{background:var(--sand);color:var(--ink);border-color:var(--line-strong)}
.free-ind svg{width:16px;height:16px}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tier{padding:24px;border-radius:20px;border:1px solid var(--line);background:#fff;box-shadow:var(--inset-hi),var(--shadow-1)}
.tier.hl{border-color:var(--teal);box-shadow:0 0 0 3px rgba(13,148,136,.12),var(--shadow-1)}
.tier h3{margin:0;font:600 1rem var(--sans)}
.tier .pr{font:400 2.25rem/1.1 var(--serif);margin:10px 0 8px;letter-spacing:-.02em}
.tier p{color:var(--mute);font-size:.9375rem}
.tier .tag{display:inline-block;margin-top:14px;font:500 .6875rem var(--mono);padding:4px 8px;border-radius:6px;background:#E6F4F1;color:#0B5A53}
.vs{margin-top:40px}
.vsrow{display:grid;grid-template-columns:130px 1fr 80px;gap:14px;align-items:center;padding:8px 0;font-size:.9375rem}
.vsrow .tr{height:14px;border-radius:7px;background:var(--sand);overflow:hidden}
.vsrow .tr i{display:block;height:100%;border-radius:7px;background:var(--line-strong);transform-origin:left;animation:grow2 .8s var(--ease-out-expo) both}
.vsrow.me .tr i{background:var(--teal)}
.vsrow .v{font:500 .875rem var(--mono);text-align:right}
@keyframes grow2{from{transform:scaleX(0)}}
.note{margin-top:18px;font-size:.8125rem;color:var(--mute)}

.rsum{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,48px);padding:26px;border-radius:22px;border:1px solid var(--line);background:#fff;box-shadow:var(--inset-hi),var(--shadow-1);margin-bottom:24px}
.rbig{text-align:center}
.rbig b{display:block;font:400 4.5rem/1 var(--serif);letter-spacing:-.04em}
.rbig small{display:block;margin-top:6px;color:var(--mute);font-size:.875rem}
.rbig .stars{margin-top:6px}
.dist{display:grid;gap:6px;align-content:center}
.dist div{display:grid;grid-template-columns:22px 1fr 36px;gap:10px;align-items:center;font:400 .8125rem var(--mono);color:var(--mute)}
.dist .tr{height:8px;border-radius:5px;background:var(--sand);overflow:hidden}
.dist .tr i{display:block;height:100%;background:var(--amber);border-radius:5px}
.lg2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:28px}
.lg2>div{padding:20px;border-radius:18px;border:1px solid var(--line);background:#fff}
.lg2 ul{display:grid;gap:8px}
.lg2 li{display:flex;gap:10px;font-size:.9375rem}
.lg2 li svg{width:18px;height:18px;flex:none;margin-top:3px}
.lg2 .love svg{color:var(--teal)}.lg2 .gr svg{color:var(--amber-ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px 24px;margin-bottom:20px;align-items:center}
.filters .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.filters .grp>span{font-size:.8125rem;color:var(--mute);margin-right:4px}
.filters .chip{height:34px;font-size:.8125rem}
.rev{padding:22px 0;border-bottom:1px solid var(--line);max-width:var(--max-width-narrow)}
.rev-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px;font-size:.875rem}
.rev-h b{font-weight:600}
.rev-h .ver{display:inline-flex;align-items:center;gap:5px;font:500 .6875rem var(--mono);padding:3px 7px;border-radius:6px;background:#E6F4F1;color:#0B5A53}
.rev-h .ver svg{width:11px;height:11px}
.rev-h .mute{color:var(--mute)}
.rev p{font-size:1rem;color:#333}
.wr{margin-bottom:22px}
.wr>summary{list-style:none;cursor:pointer;display:inline-flex}
.wr>summary::-webkit-details-marker{display:none}
.wr .fm{margin-top:18px;padding:22px;border-radius:20px;border:1px solid var(--line);background:var(--white);box-shadow:var(--inset-hi),var(--shadow-1)}

.alts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.alt{display:flex;flex-direction:column;gap:12px}
.alt .tcard{flex:1}
.alt-f{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 4px;font-size:.875rem;flex-wrap:wrap}
.alt-f .vs-l{color:var(--mute)}
.alt-f .vs-l b{color:var(--ink);font:500 .875rem var(--mono)}

.similar{margin-top:clamp(56px,8vw,96px);padding-top:clamp(36px,5vw,56px);border-top:1px solid var(--line)}
.similar-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.similar-h h2{font-size:clamp(1.9rem,3.6vw,2.8rem);line-height:1.05}
.carr{display:flex;gap:8px}
.carr button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;display:grid;place-items:center;box-shadow:var(--inset-hi);transition:border-color var(--duration-fast),opacity var(--duration-fast)}
.carr button:hover{border-color:var(--ink)}
.carr button[disabled]{opacity:.35;pointer-events:none}
.carr svg{width:18px;height:18px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--gutter)*-1);padding:6px var(--gutter) 24px;scroll-padding-inline:var(--gutter)}
.rail::-webkit-scrollbar{display:none}
.rail .tcard{flex:none;width:min(300px,78vw);scroll-snap-align:start}

@media (max-width:960px){
  .tgrid{grid-template-columns:minmax(0,1fr)}
  .side{position:static;order:2;display:grid;grid-template-columns:1fr 1fr;gap:28px}
  .side>div:first-child{grid-column:1/-1}
  .tabs{top:56px}
}
@media (max-width:680px){
  .thead{flex-direction:column}
  .thead .lg{width:64px;height:64px;border-radius:18px}
  .fit,.lg2,.alts,.flist,.gal{grid-template-columns:1fr}
  .side{grid-template-columns:1fr}
  .rsum{grid-template-columns:1fr}
  .vsrow{grid-template-columns:96px 1fr 64px}
  .tact .btn{flex:1 1 auto}
}
</style>
</head>
<body data-page="tool">
<main id="main" class="page"><div class="wrap" id="app"></div></main>

<script src="shared.js"></script>
<script>
AF.ready.then(()=>{
'use strict';
const {$,$$,esc,RM,CATS,T,FEAT,has,byId,lg,stars,isFree,price,priceNum,startLabel,freeLabel,platforms,ARROW,toolUrl,catUrl,cmpUrl,tiers,reviews,hash,card,toast,observe,fmt}=AF;
const app=$('#app');
const lc=s=>s[0].toLowerCase()+s.slice(1);
const t=byId(new URLSearchParams(location.search).get('id'));

const CHECK='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 9.5l4 4 7-8"/></svg>';
const CROSS='<svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l8 8M13 5l-8 8"/></svg>';
const BACK='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg>';
const HEART=f=>`<svg viewBox="0 0 20 20" fill="${f?'currentColor':'none'}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M10 16.5S3 12.2 3 7.6A3.6 3.6 0 0 1 10 6.2a3.6 3.6 0 0 1 7 1.4c0 4.6-7 8.9-7 8.9z"/></svg>`;
const EXT='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12L12 4M6 4h6v6"/></svg>';

if(!t){
  document.title='Page not found | AutomationFindr';
  app.innerHTML=`<div class="empty"><h2>This page automated itself out of existence.</h2><p>We couldn't find a tool with that ID. Let's get you back.</p><a class="btn" href="${catUrl()}">Browse all tools</a></div>`;
}else render();

function render(){
  const cat=CATS[t.cat], c=cat.c;
  document.title=`${t.n}: pricing, features and reviews | AutomationFindr`;
  const same=T.filter(x=>x.cat===t.cat&&x.id!==t.id).sort((a,b)=>b.r-a.r);
  const tagSim=T.filter(x=>x.id!==t.id).map(x=>({x,s:x.tg.filter(g=>t.tg.includes(g)).length+(x.cat===t.cat?2:0)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s||b.x.r-a.x.r).map(o=>o.x);
  const alts=(same.length>=2?same:[...new Set([...same,...tagSim])]).slice(0,4);
  const similar=[...new Set([...same,...tagSim])].slice(0,10);
  const revs=reviews(t);
  const isSaved=()=>AF.isSaved(t.id);
  /* reviews sent from this device: kept locally, labelled pending until moderated */
  const mineKey=`af:review:${t.id}`;
  const mine=()=>{ try{ const m=JSON.parse(localStorage.getItem(mineKey)||'[]'); return Array.isArray(m)?m:[]; }catch(e){ return []; } };
  const addMine=r=>{ try{ localStorage.setItem(mineKey,JSON.stringify([r,...mine()])); }catch(e){} };
  let back=false; try{ back=!!document.referrer&&new URL(document.referrer).origin===location.origin&&document.referrer!==location.href; }catch(e){}

  const palette=['#2563EB','#7C3AED','#0F766E','#B45309','#BE3A5C','#3B6BA5','#4D7C0F','#9D3F8F'];
  const ints=t.int.map(n=>`<span><span class="lg" style="--lc:${palette[hash(n)%palette.length]}" data-n="2" aria-hidden="true">${esc(n.slice(0,2))}</span>${esc(n)}</span>`).join('');

  /* overview copy is assembled from the tool's own data so it stays specific */
  const overview=[
   `${esc(t.d)} It launched in ${t.f} and sits in our ${esc(cat.n)} category, with ${fmt(t.rv)} reviews averaging ${t.r}.`,
   `People mention the same two things when they recommend it: ${esc(lc(t.love[0]))}, and ${esc(lc(t.love[1]))}. ${esc(t.uniq)} is the part competitors don't copy.`,
   `The honest trade-offs: ${esc(lc(t.gripe[0]))}, and ${esc(lc(t.gripe[1]))}. Neither is a dealbreaker for the right team, which is why the next section says who that is.`
  ];
  const shots=[
   ['Workflow canvas',`<svg viewBox="0 0 200 130" aria-hidden="true"><g fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="3 3"><path d="M64 45h20c10 0 10 40 26 40M64 85h12"/></g><g><rect x="14" y="30" width="50" height="30" rx="7" fill="#fff" stroke="#D3D0C8"/><rect x="20" y="38" width="12" height="12" rx="4" fill="${t.c}"/><rect x="14" y="70" width="50" height="30" rx="7" fill="#fff" stroke="#D3D0C8"/><rect x="20" y="78" width="12" height="12" rx="4" fill="${c}"/><rect x="110" y="55" width="62" height="34" rx="7" fill="#fff" stroke="${c}"/><rect x="118" y="64" width="14" height="14" rx="4" fill="${c}"/></g></svg>`],
   ['Run history',`<svg viewBox="0 0 200 130" aria-hidden="true"><g font-family="monospace" font-size="7" fill="#6B6B6B">${[0,1,2,3,4].map(i=>`<rect x="12" y="${14+i*21}" width="176" height="16" rx="5" fill="${i===0?'#F2F0EB':'#fff'}" stroke="#E5E3DE"/><circle cx="22" cy="${22+i*21}" r="3" fill="${i===3?'#BE3A5C':'#16A34A'}"/><text x="32" y="${25+i*21}">run_${4821-i}</text><text x="150" y="${25+i*21}">${i===3?'failed':'ok'} ${(1.2+i*.7).toFixed(1)}s</text>`).join('')}</g></svg>`],
   ['Usage',`<svg viewBox="0 0 200 130" aria-hidden="true"><g fill="${c}" opacity=".85">${[34,52,44,70,62,88,76].map((h,i)=>`<rect x="${18+i*24}" y="${112-h}" width="14" height="${h}" rx="3"/>`).join('')}</g><path d="M12 112h176" stroke="#D3D0C8"/></svg>`]
  ];

  const tabs=[['overview','Overview'],['features','Features'],['pricing','Pricing'],['reviews','Reviews',fmt(t.rv)],['alternatives','Alternatives']];
  const feats=FEAT[t.cat];
  const featCount=feats.reduce((n,[,l])=>n+l.length,0), have=feats.reduce((n,[,l])=>n+l.filter(([f])=>has(t,f)).length,0);

  const tr=tiers(t);
  const vsPool=[t,...same.slice(0,3)].sort((a,b)=>priceNum(a)-priceNum(b));
  const maxP=Math.max(...vsPool.map(x=>priceNum(x)>=9999?0:priceNum(x)),1);
  const vsRows=vsPool.map(x=>`<div class="vsrow${x.id===t.id?' me':''}"><b style="font-weight:${x.id===t.id?600:500}">${esc(x.n)}</b><div class="tr"><i style="width:${Math.max(4,(priceNum(x)>=9999?0:priceNum(x))/maxP*100)}%"></i></div><span class="v">${startLabel(x)}</span></div>`).join('');

  const rr=Math.round(t.r);
  const dist=[5,4,3,2,1].map(n=>[n,n===rr?52:Math.abs(n-rr)===1?26:n>rr?10:4]);
  const dsum=dist.reduce((a,[,w])=>a+w,0);

  app.innerHTML=`
   <a class="crumb" href="${back?'#':catUrl(t.cat)}" id="crumb">${BACK}Back to results</a>
   <header class="thead" style="--c:${c}">
     ${lg(t)}
     <div>
       <h1>${esc(t.n)}</h1>
       <div class="tmeta">
         <span class="rate">${stars(t.r)}<b>${t.r}</b><span class="n">${fmt(t.rv)} reviews</span></span><span class="dot"></span>
         <a class="pillcat" href="${catUrl(t.cat)}"><span style="display:grid">${cat.i}</span>${esc(cat.n)}</a><span class="dot"></span>
         <span class="mute">Since ${t.f}</span>${t.a<=7?'<span class="new">New</span>':''}
       </div>
       <p class="tline">${esc(t.d)}</p>
       <div class="tact">
         <a class="btn" href="${esc(t.url)}" target="_blank" rel="noopener noreferrer">Visit website ${EXT}</a>
         <a class="btn ghost" href="${cmpUrl([t.id])}">Compare with…</a>
         <button class="btn ghost" id="save" type="button" aria-pressed="${isSaved()}">${HEART(isSaved())}<span>${isSaved()?'Saved':'Save'}</span></button>
       </div>
     </div>
   </header>

   <div class="tgrid">
     <aside class="side" aria-label="Quick info">
       <div><h2>Quick info</h2><dl class="qi">
         <div><dt>Pricing</dt><dd>${esc(t.p)}</dd></div>
         <div><dt>Free tier</dt><dd class="${isFree(t)?'yes':''}">${isFree(t)?'Yes':freeLabel(t)==='Free trial'?'Trial only':'No'}</dd></div>
         <div><dt>API</dt><dd class="${t.fl.includes('api')?'yes':''}">${t.fl.includes('api')?'Yes':'No'}</dd></div>
         <div><dt>Platform</dt><dd>${platforms(t).join(', ')}</dd></div>
         <div><dt>Founded</dt><dd>${t.f}</dd></div>
         <div><dt>Open source</dt><dd>${t.fl.includes('os')?'Yes':'No'}</dd></div></dl></div>
       <div><h2>Categories</h2><div class="pills"><a href="${catUrl(t.cat)}">${esc(cat.n)}</a>${(t.sub||[]).map(k=>`<a href="${catUrl(k)}">${esc(CATS[k].n)}</a>`).join('')}${t.tg.map(g=>`<a href="${catUrl(t.cat)}">${esc(g)}</a>`).join('')}</div></div>
       <div><h2>Integrates with</h2><div class="ints">${ints}</div></div>
     </aside>

     <div>
       <div class="tabs" role="tablist" aria-label="Tool sections">${tabs.map(([k,n,ct],i)=>`<button role="tab" id="tab-${k}" aria-controls="p-${k}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-k="${k}">${n}${ct?`<span class="ct">${ct}</span>`:''}</button>`).join('')}</div>

       <section class="panel" role="tabpanel" id="p-overview" aria-labelledby="tab-overview">
         <h2>What it is</h2>
         <div class="prose">${overview.map(p=>`<p>${p}</p>`).join('')}</div>
         <div class="fit">
           <div class="yes"><h3>${CHECK}Best for</h3><p>${esc(t.best)}.</p></div>
           <div class="no"><h3>${CROSS}Not ideal for</h3><p>${esc(t.not)}.</p></div>
         </div>
         <h3 style="margin-top:40px">A look inside</h3>
         <div class="gal" style="margin-top:12px">${shots.map(([cap,svg])=>`<figure><div class="win"><div><div class="bar"><i></i><i></i><i></i></div>${svg}</div></div><figcaption>${cap}. Illustration, not a live screenshot.</figcaption></figure>`).join('')}</div>
       </section>

       <section class="panel" role="tabpanel" id="p-features" aria-labelledby="tab-features" hidden>
         <h2>Features</h2>
         <p style="color:var(--mute);margin:-6px 0 22px">${have} of ${featCount} features we track in ${esc(cat.n)}. Hover or focus a row for what it means.</p>
         <div class="uniq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.4 5.6 6.1.6-4.6 4.1 1.3 6L12 16.2 6.8 19.3l1.3-6L3.5 9.2l6.1-.6z"/></svg><div><b>What only ${esc(t.n)} does</b>${esc(t.uniq)}.</div></div>
         ${feats.map(([g,list])=>`<div class="fgroup"><h3>${g}</h3><ul class="flist">${list.map(([f,tip])=>{const y=has(t,f);return `<li class="${y?'y':'n'}" tabindex="0" data-tip="${esc(tip)}">${y?CHECK:CROSS}<span>${esc(f)}${y?'':'<span class="sr"> (not available)</span>'}</span></li>`}).join('')}</ul></div>`).join('')}
         <p class="note">Checklist is illustrative mock data until each vendor is verified.</p>
       </section>

       <section class="panel" role="tabpanel" id="p-pricing" aria-labelledby="tab-pricing" hidden>
         <h2>Pricing</h2>
         <span class="free-ind ${isFree(t)?'':'paid'}">${isFree(t)?CHECK:CROSS}${freeLabel(t)}</span>
         <div class="tiers">${tr.map(x=>`<div class="tier"><h3>${esc(x.n)}</h3><div class="pr">${esc(x.p)}</div>${x.d?`<p>${esc(x.d)}</p>`:''}</div>`).join('')}</div>
         <div class="vs"><h3>Starting price next to its closest alternatives</h3>${vsRows}</div>
         <p class="note">${t.pricing.verified?`Checked against <a href="${esc(t.pricing.src)}" target="_blank" rel="noopener noreferrer">the vendor's page</a> on ${new Date(t.pricing.verified).toLocaleDateString('en-US',{dateStyle:'long',timeZone:'UTC'})}.`:'Not verified against the vendor page yet.'} ${esc(t.pricing.note)} Confirm on the vendor's site before you buy.</p>
       </section>

       <section class="panel" role="tabpanel" id="p-reviews" aria-labelledby="tab-reviews" hidden>
         <h2>Reviews</h2>
         <div class="rsum">
           <div class="rbig"><b>${t.r}</b>${stars(t.r)}<small>${fmt(t.rv)} reviews</small></div>
           <div class="dist" aria-label="Rating distribution">${dist.map(([n,w])=>`<div><span>${n}</span><div class="tr"><i style="width:${Math.round(w/dsum*100)}%"></i></div><span>${Math.round(w/dsum*100)}%</span></div>`).join('')}</div>
         </div>
         <div class="lg2">
           <div class="love"><h3>What people love</h3><ul>${t.love.map(x=>`<li>${CHECK}${esc(x)}</li>`).join('')}</ul></div>
           <div class="gr"><h3>Common complaints</h3><ul>${t.gripe.map(x=>`<li>${CROSS}${esc(x)}</li>`).join('')}</ul></div>
         </div>
         <div class="filters" id="rf">
           <div class="grp" data-g="r"><span>Rating</span>${[['all','All'],['5','5 stars'],['4','4 stars'],['3','3 or less']].map(([v,l],i)=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${i===0}">${l}</button>`).join('')}</div>
           <div class="grp" data-g="u"><span>Reviewer</span>${['all','SMB','Enterprise','Freelancer'].map((v,i)=>`<button class="chip" type="button" data-v="${v}" aria-pressed="${i===0}">${v==='all'?'All':v}</button>`).join('')}</div>
         </div>
         <details class="wr" id="wr">
           <summary class="btn ghost">Write a review</summary>
           <form class="fm" id="rform">
             <div class="fm-2">
               <div class="fld"><label for="rv-r">Rating</label><select id="rv-r" name="rating" required><option value="">Choose…</option><option value="5">5, excellent</option><option value="4">4, good</option><option value="3">3, okay</option><option value="2">2, poor</option><option value="1">1, avoid</option></select></div>
               <div class="fld"><label for="rv-u">You are a</label><select id="rv-u" name="reviewer" required><option>SMB</option><option>Freelancer</option><option>Enterprise</option></select></div>
             </div>
             <div class="fld"><label for="rv-t">Your review</label><textarea id="rv-t" name="text" required minlength="20" maxlength="1200" placeholder="What did you use it for, and what would you tell a friend?"></textarea></div>
             <div class="fm-2">
               <div class="fld"><label for="rv-n">Name shown <small>(optional)</small></label><input id="rv-n" name="name" maxlength="40" autocomplete="given-name" placeholder="Anonymous"></div>
               <div class="fld"><label for="rv-e">Email</label><input id="rv-e" name="email" type="email" required autocomplete="email" placeholder="your@email.com"><small>Never shown. Used to confirm you really used the tool.</small></div>
             </div>
             <input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
             <div class="fm-act"><button class="btn" type="submit">Send review</button><p class="fstat" id="rstat" role="status" aria-live="polite"></p></div>
           </form>
         </details>
         <p class="note" style="margin:0 0 6px">The reviews below are illustrative samples. New reviews are read by a person before they are published.</p>
         <div id="rlist" aria-live="polite"></div>
       </section>

       <section class="panel" role="tabpanel" id="p-alternatives" aria-labelledby="tab-alternatives" hidden>
         <h2>Alternatives</h2>
         <p style="color:var(--mute);margin:-6px 0 22px;max-width:var(--max-width-narrow)">Closest options by category and rating, with the numbers that usually decide it.</p>
         <div class="alts">${alts.map(a=>`<div class="alt">${card(a).replace(' rv"','"')}<div class="alt-f"><span class="vs-l">${esc(a.n)} <b>${startLabel(a)}</b> vs ${esc(t.n)} <b>${startLabel(t)}</b></span><a class="link" href="${cmpUrl([t.id,a.id])}"><span>Compare</span>${ARROW}</a></div><a class="link" style="padding:0 4px;font-size:.875rem" href="switch.html?from=${a.id}&to=${t.id}"><span>Switching from ${esc(a.n)} to ${esc(t.n)}</span>${ARROW}</a></div>`).join('')}</div>
       </section>
     </div>
   </div>

   <section class="similar" aria-labelledby="h-sim">
     <div class="similar-h"><h2 id="h-sim">Similar tools</h2><div class="carr"><button id="cl" type="button" aria-label="Scroll similar tools left"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 3L5 9l6 6"/></svg></button><button id="cr" type="button" aria-label="Scroll similar tools right"><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3l6 6-6 6"/></svg></button></div></div>
     <div class="rail" id="rail" tabindex="0" role="region" aria-label="Similar tools">${similar.map((s,i)=>card(s,i)).join('')}</div>
   </section>`;

  $('#crumb').addEventListener('click',e=>{ if(back){ e.preventDefault(); history.back(); } });

  const sv=$('#save');
  sv.addEventListener('click',()=>{ const s=AF.toggleSaved(t.id); sv.setAttribute('aria-pressed',s); sv.innerHTML=`${HEART(s)}<span>${s?'Saved':'Save'}</span>`; toast(s?`${t.n} saved on this device.`:`${t.n} removed from saved.`); });

  /* tabs: arrow keys, Home/End, URL hash */
  const tabEls=$$('[role=tab]'), panels=$$('[role=tabpanel]');
  function pick(k,focus){
    tabEls.forEach(b=>{ const on=b.dataset.k===k; b.setAttribute('aria-selected',on); b.tabIndex=on?0:-1; if(on&&focus) b.focus(); });
    panels.forEach(p=>p.hidden=p.id!=='p-'+k);
    history.replaceState(null,'',`${location.search}#${k}`);
  }
  $('.tabs').addEventListener('click',e=>{ const b=e.target.closest('[role=tab]'); if(b) pick(b.dataset.k); });
  $('.tabs').addEventListener('keydown',e=>{
    const i=tabEls.findIndex(b=>b.getAttribute('aria-selected')==='true'); let n=-1;
    if(e.key==='ArrowRight') n=(i+1)%tabEls.length; else if(e.key==='ArrowLeft') n=(i-1+tabEls.length)%tabEls.length; else if(e.key==='Home') n=0; else if(e.key==='End') n=tabEls.length-1;
    if(n>=0){ e.preventDefault(); pick(tabEls[n].dataset.k,true); }
  });
  const h=location.hash.slice(1); if(tabs.some(([k])=>k===h)) pick(h);

  /* review filters */
  const f={r:'all',u:'all'}, rl=$('#rlist');
  function showRevs(){
    const list=[...mine().map(r=>({...r,pending:true})),...revs].filter(r=>(f.r==='all'||(f.r==='3'?r.r<=3:r.r===+f.r))&&(f.u==='all'||r.u===f.u));
    rl.innerHTML=list.length?list.map(r=>`<article class="rev"><div class="rev-h">${stars(r.r,1)}<b>${esc(r.n)}</b><span class="tagpill">${esc(r.u)}</span>${r.v?`<span class="ver">${CHECK}Verified</span>`:''}${r.pending?'<span class="tagpill">Pending review, visible only to you</span>':`<span class="mute">${r.days} days ago</span>`}</div><p>${esc(r.t)}</p></article>`).join(''):
     `<div class="empty" style="padding:32px 0;text-align:left"><p style="margin:0 0 14px">No reviews match those filters.</p><button class="btn ghost" type="button" id="rreset">Start fresh</button></div>`;
    const rs=$('#rreset'); if(rs) rs.addEventListener('click',()=>{ f.r=f.u='all'; $$('#rf .chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v==='all')); showRevs(); });
  }
  $('#rf').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c) return; f[c.closest('.grp').dataset.g]=c.dataset.v; $$('.chip',c.parentElement).forEach(x=>x.setAttribute('aria-pressed',x===c)); showRevs(); });
  showRevs();

  /* write a review: POST to AF endpoint "review"; stays local and pending until a person approves it */
  const rform=$('#rform'), rstat=$('#rstat'), rbtn=$('button',rform);
  rform.addEventListener('submit',async e=>{
    e.preventDefault();
    if(!rform.reportValidity()) return;
    rbtn.disabled=true; rstat.className='fstat'; rstat.textContent='Sending…';
    try{ await AF.submitForm('review',rform,{tool:t.id}); }
    catch(err){ rbtn.disabled=false; rstat.className='fstat err'; rstat.textContent=AF.failMsg(err); return; }
    const d=new FormData(rform);
    addMine({r:+d.get('rating'),u:d.get('reviewer'),n:d.get('name').trim()||'Anonymous',t:d.get('text').trim()});
    rform.reset(); rbtn.disabled=false; rstat.textContent=''; $('#wr').open=false;
    showRevs(); toast('Thanks. We read every review before it goes live.');
  });

  /* carousel */
  const rail=$('#rail'), cl=$('#cl'), cr=$('#cr');
  const st=()=>{ cl.disabled=rail.scrollLeft<8; cr.disabled=rail.scrollLeft>rail.scrollWidth-rail.clientWidth-8; };
  rail.addEventListener('scroll',st,{passive:true}); addEventListener('resize',st); st();
  cl.addEventListener('click',()=>rail.scrollBy({left:-316,behavior:RM?'auto':'smooth'}));
  cr.addEventListener('click',()=>rail.scrollBy({left:316,behavior:RM?'auto':'smooth'}));

  observe();
}
});
</script>
</body>
</html>
